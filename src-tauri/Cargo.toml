[package]
name = "talkie"
version = "0.1.0"
description = "Talkie Windows push-to-talk desktop client"
authors = ["Talkie contributors"]
edition = "2021"

[lib]
name = "talkie_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-global-shortcut = "2"
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
strip = true
