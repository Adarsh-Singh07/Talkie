name: Windows MVP build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Tests and validation-only production compile
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:contract
      - name: Verify missing and insecure release configuration fail
        run: npm run test:build-config
      - name: Compile only; this fixture is NOT a deployment or distributable
        env:
          VITE_SIGNALING_URL: wss://signal.talkie-validation-fixture.net/rooms
        run: npm run build
      - run: npm run test:production
      - name: Explain artifact gate
        run: echo "Validation output is not published. Candidate job requires the VITE_SIGNALING_URL repository variable and a successful public TLS/WebSocket probe."

  candidate:
    name: Verified-endpoint unsigned Windows candidate
    needs: checks
    if: ${{ github.event_name != 'pull_request' && vars.VITE_SIGNALING_URL != '' }}
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      # Public build-time setting only. Never pass server TURN/admin secrets here.
      VITE_SIGNALING_URL: ${{ vars.VITE_SIGNALING_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify public health, trusted TLS, WebSocket and room protocol
        run: npm run verify:public
      - run: rustup show
      - run: npm run tauri -- info
      - run: npm run tauri -- build -- --locked
      - name: Record artifact checksums
        shell: pwsh
        run: |
          node scripts/verify-windows.mjs | Tee-Object -FilePath artifact-checksums.jsonl
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: Talkie-Windows-x64-unsigned
          if-no-files-found: error
          retention-days: 14
          path: |
            src-tauri/target/release/talkie.exe
            src-tauri/target/release/bundle/nsis/*-setup.exe
            client/dist/talkie-build.json
            artifact-checksums.jsonl
